name: Update and Deploy

on:
  schedule:
    # 미국 정규장 마감(4PM ET) + 1시간 = 5PM ET = 22:00 UTC (서머타임), 21:00 UTC (겨울)
    # 안전하게 22:00 UTC로 설정 (한국시간 오전 7시)
    - cron: '0 22 * * 1-5'  # 월-금 22:00 UTC
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python screener.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Build
        working-directory: ./dashboard
        run: npm run build

      - name: Copy stock data to dist
        run: cp dashboard/public/stock_data.json dashboard/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/dist
